name: Release

# Deliberate, human-gated releases (docs/release-process.md in the
# chatwright/chatwright repository): a maintainer pushes an annotated
# `vX.Y.Z` tag and the shared strongo/cicd release workflow runs GoReleaser
# for exactly that version (the shared workflow skips its auto-bump step on a
# tag ref). There is deliberately no push-to-main trigger — Chatwright
# releases are not continuous delivery pre-1.0.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Pinned to an exact tag, not the moving @v1: that tag defines the
    # require_notarized_macos input but does NOT contain the
    # macos_signing_preflight job, so the gate silently no-ops there.
    uses: strongo/cicd/.github/workflows/release.yml@v1.14.17
    permissions:
      contents: write
    with:
      # Must be >= go.mod's `go` directive (currently 1.27.0). The shared
      # release job runs its `go mod tidy` before-hook under this setup-go
      # version with GOTOOLCHAIN=local, so leaving it unset (default '1.26')
      # fails with "go.mod requires go >= 1.27.0" before the build starts.
      go_version: '1.27.0'
      # Pre-1.0 (docs/release-process.md "Version policy"): never auto-bump
      # to a new major. A tag push fixes the version anyway, so this is a
      # belt-and-braces default, same as ci.yml's.
      allow_major_version_bump: false
      # Block publication unless the macOS build is genuinely signed, notarized,
      # AND executable. Without this the preflight gate never runs: specscore-cli
      # v0.37.10 shipped a binary macOS SIGKILLs, with a green release.
      # See https://github.com/strongo/cicd/issues/66
      require_notarized_macos: true
    secrets:
      # Cross-repo PAT (classic, public_repo scope) for pushing the Homebrew
      # cask manifest to chatwright/homebrew-tap. Forwarded to GoReleaser as
      # $GORELEASER_GITHUB_TOKEN and referenced by .goreleaser.yml.
      GORELEASER_GITHUB_TOKEN: ${{ secrets.CHATWRIGHT_GORELEASER_GITHUB_TOKEN }}
      # macOS signing + notarization. These activate the `notarize:` block in
      # .goreleaser.yml, which is gated on MACOS_SIGN_P12 being set. See
      # ingitdb/ingitdb-cli's release.yml, the reference implementation this
      # block is copied from.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}