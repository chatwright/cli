name: Go CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    permissions:
      contents: write
    secrets:
      # No private Go modules — the built-in token is sufficient.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      code_coverage: true
      # Releases are deliberate pre-1.0 (the standard repository's
      # docs/release-process.md): manual annotated tags + CHANGELOG, not
      # auto-bumped patches.
      disable-version-bumping: true
      # Version policy (the standard repository's docs/release-process.md
      # "Version policy"): stay on v0.x, never auto-bump major from a
      # `feat!:`/`BREAKING CHANGE:` marker. Version bumping is fully
      # disabled above, so this input is a no-op today — set explicitly so
      # the policy still holds if this repo ever adopts the shared
      # workflow's auto-tag path. When false (the strongo/cicd default too),
      # a disallowed major bump is capped to a minor bump with a warning,
      # never a failed run.
      allow_major_version_bump: false

  # Fail fast on go.mod/go.sum drift.
  #
  # This is the signal that would have caught datatug-cli's v0.13.2 before it
  # shipped: two renovate pull requests for the same major bump interleaved and
  # left go.mod requiring a version nothing imported. Build-and-test caught the
  # stale imports only after both had merged; an untidy go.mod is visible on the
  # FIRST of the pair, on its own pull request.
  #
  # `-diff` only reports; it never rewrites go.mod, so unlike a mutating
  # `go mod tidy` it cannot mask the drift it is meant to find. This job belongs
  # to the workflow named by release.yml's `require_workflow_success`, so drift
  # also blocks the release, not just the merge.
  go-mod-tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Must be >= this repo's go.mod `go` directive.
          go-version: '1.27.0'
          cache: true
      - name: go mod tidy -diff
        run: go mod tidy -diff
