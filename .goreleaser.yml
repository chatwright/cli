version: 2

project_name: chatwright

before:
  hooks:
    - go mod tidy

builds:
  - id: chatwright
    main: ./cmd/chatwright
    binary: chatwright
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/strongo/buildinfo.version={{.Version}}
      - -X github.com/strongo/buildinfo.commit={{.FullCommit}}
      - -X github.com/strongo/buildinfo.date={{.Date}}

archives:
  - id: chatwright
    ids:
      - chatwright
    name_template: "chatwright_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    formats: [tar.gz]

checksum:
  name_template: "chatwright_{{ .Version }}_checksums.txt"
  algorithm: sha256

# macOS signing + notarization — DORMANT unless MACOS_SIGN_P12 is set, in
# which case the shared strongo/cicd release.yml forwards it (and the other
# four Apple secrets) to this job. GoReleaser's notarize is pure Go (quill),
# so this runs on the existing job — no macOS runner needed. See
# ingitdb/ingitdb-cli's .goreleaser.yaml, the reference implementation this
# block is copied from.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [chatwright]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        wait: true
        issuer_id: "{{ .Env.NOTARIZE_ISSUER_ID }}"
        key_id: "{{ .Env.NOTARIZE_KEY_ID }}"
        key: "{{ .Env.NOTARIZE_KEY }}"
        timeout: 20m

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# Homebrew cask — the ecosystem standard (strongo/cicd README "Packaging
# conventions": casks, not the deprecated `brews:` formulas, because we ship
# prebuilt binaries). Install with:
#   brew install --cask chatwright/tap/chatwright
# (the tap-qualified `brew install chatwright/tap/chatwright` also resolves).
#
# The cask manifest is pushed to chatwright/homebrew-tap under
# Casks/chatwright.rb. Uses $GORELEASER_GITHUB_TOKEN, which the shared
# strongo/cicd release workflow forwards from this repo's
# CHATWRIGHT_GORELEASER_GITHUB_TOKEN secret (a classic PAT with public_repo
# scope — the default GITHUB_TOKEN cannot push to another repository).
#
# The canonical install remains the chatwright.dev install script
# (`curl -fsSL https://chatwright.dev/install.sh | sh`); the cask is the
# Homebrew-native alternative on macOS. Linux users use the script or
# `go install chatwright.dev/cli/cmd/chatwright@latest`.
homebrew_casks:
  - name: chatwright
    ids:
      - chatwright
    # Skip publishing the cask when the cross-repo PAT is absent (the shared
    # workflow forwards an empty env in that case): the release itself —
    # binaries + checksums, which the canonical install script consumes —
    # must never be blocked on the tap credential. Setting the
    # CHATWRIGHT_GORELEASER_GITHUB_TOKEN secret activates the cask on the
    # next release with no config change.
    skip_upload: '{{ if eq (envOrDefault "GORELEASER_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    description: "Chatwright CLI — deterministic and AI-driven testing for conversational applications."
    homepage: https://chatwright.dev
    license: Apache-2.0
    repository:
      owner: chatwright
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GORELEASER_GITHUB_TOKEN }}"
